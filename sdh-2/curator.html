<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/curator.css">
    <script src="./js/header.js" defer></script>
</head>

<body>
    <main>
        <section class="con2">
            <div class="common-frame">
                <div class="section-title">
                    <div class="section-title-wrap">
                        <div class="section-maintitle">
                            이럴 땐 이런 책
                        </div>
                        <div class="section-title-icn">
                            <a href="#">
                                <img src="./img/icn-arrow right.svg" alt="더보기 아이콘">
                            </a>
                        </div>
                    </div>
                    <div class="con2-subtitle">회원이 묻고 답하는 도서 추천</div>
                </div>
                <div class="con2-cardlist-wrap">
                    <ul>
                        <li>
                            <a href="#">
                                <div class="con2-quest">
                                    <div class="con2-q-wrap">
                                        <div class="con2-q-upper">
                                            <div class="con2-badge">이주의 질문</div>
                                            <div class="con2-badge-title">8월3주 질문 도착!</div>
                                        </div>
                                        <div class="con2-quest-subt">
                                            이번 주에도 다양한 책 이야기가 도착했어요.
                                        </div>
                                    </div>
                                </div>
                                <div class="con2-user-q">
                                    <div class="con2-user-info">
                                        <div class="con2-user-info-wrap">
                                            <div class="con2-user-icn">
                                                <img src="./img/user-profile-icn.png" alt="">
                                            </div>
                                            <div class="con2-user-id">
                                                booklover_92
                                            </div>
                                        </div>
                                        <div class="con2-user-q-txt">
                                            요즘 읽을 책을 고르고 있는데,
                                            가볍게 시작하기 좋은 소설이 있을까요?
                                        </div>
                                    </div>
                                    <figure class="mini-book-cover">
                                        <img src="./img/mini-book-cover1.png" alt="미니 북 커버">
                                    </figure>
                                </div>
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </section>

        
        <section class="con3">
            <div class="common-frame">
                 <div class="section-title">
                    <div class="section-title-wrap">
                        <div class="section-maintitle">
                            AI와 함께 읽는 나를 일으킬 책들
                        </div>
                        <div class="section-title-icn">
                            <a href="#">
                                <img src="./img/icn-arrow right.svg" alt="더보기 아이콘">
                            </a>
                        </div>
                    </div>
                    <div class="con2-subtitle">책의 핵심 정보만 쏙쏙 찾아주는 AI 독파밍</div>
                </div>
                <div class="con3-cardlist-wrap">
                    
                </div>
            </div>
        </section>
