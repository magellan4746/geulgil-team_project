<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 도서</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/font.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <!-- 히어로배너 영역 -->
  <section class="hero-banner" aria-label="추천 도서 배너">
    <a class="hero-slide is-active" href="#">
      <img src="./img/HERO PC 1.png" alt="오늘의 추천도서" />
    </a>

    <a class="hero-slide" href="#">
      <img src="./img/HERO PC 2.png" alt="기억을 바꾸는 법" />
    </a>

    <a class="hero-slide" href="#">
      <img src="./img/HERO PC 3.png" alt="농구인 김영기" />
    </a>

    <a class="hero-slide" href="#">
      <img src="./img/HERO PC 4.png" alt="부의 갈림길" />
    </a>
  </section>
<!-- 메인 카테고리 -->
<nav class="main-categories" aria-label="메인 카테고리">
  <div class="main-categories__inner">

    <ul class="category-list">

      <!-- 오늘의 추천 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on1.png"
            data-default="./img/on1.png"
            data-hover="./img/hover1.png"
            alt="오늘의 추천"
          >
          <span class="category-name">오늘의 추천</span>
        </a>
      </li>


      <!-- 신간 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on2.png"
            data-default="./img/on2.png"
            data-hover="./img/hover2.png"
            alt="신간"
          >
          <span class="category-name">신간</span>
        </a>
      </li>


      <!-- 베스트 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on3.png"
            data-default="./img/on3.png"
            data-hover="./img/hover3.png"
            alt="베스트"
          >
          <span class="category-name">베스트</span>
        </a>
      </li>


      <!-- 화제의 책 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on4.png"
            data-default="./img/on4.png"
            data-hover="./img/hover4.png"
            alt="화제의 책"
          >
          <span class="category-name">화제의 책</span>
        </a>
      </li>


      <!-- 이달의 책 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on5.png"
            data-default="./img/on5.png"
            data-hover="./img/hover5.png"
            alt="이달의 책"
          >
          <span class="category-name">이달의 책</span>
        </a>
      </li>


      <!-- 장르별 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on6.png"
            data-default="./img/on6.png"
            data-hover="./img/hover6.png"
            alt="장르별"
          >
          <span class="category-name">장르별</span>
        </a>
      </li>


      <!-- 테마별 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on7.png"
            data-default="./img/on7.png"
            data-hover="./img/hover7.png"
            alt="테마별"
          >
          <span class="category-name">테마별</span>
        </a>
      </li>


      <!-- 작가 이야기 -->
      <li>
        <a class="category-item" href="#">
          <img
            class="category-image"
            src="./img/on8.png"
            data-default="./img/on8.png"
            data-hover="./img/hover8.png"
            alt=""
          >
          <span class="category-name">작가 이야기</span>
        </a>
      </li>

    </ul>

  </div>
</nav>



  <main class="main">

    <section class="new-books">

      <!-- 상단 제목 -->
      <div class="section-header">
        <button
          type="button"
          class="section-title-btn"
          id="nextButton"
          aria-label="다음 책 보기"
        >
          <span class="section-title">지금 주목할 신작</span>
          <span class="arrow"></span>
        </button>
      </div>

      <!-- 책 목록 -->
      <div class="book-list" id="bookList">

        <!-- 01 -->
        <article class="book-card">
          <div class="book-cover">
            <img
              src="./img/sin 1.jpg"
              alt="안녕이라 그랬어"
            />
          </div>

          <div class="book-info">
            <h3 class="book-title">안녕이라 그랬어</h3>
            <p class="book-author">김애란</p>
          </div>
        </article>

        <!-- 02 -->
        <article class="book-card">
          <div class="book-cover">
            <img
              src="./img/sin 2.jpg"
              alt="용의자 X의 헌신"
            />
          </div>

          <div class="book-info">
            <h3 class="book-title">용의자 X의 헌신</h3>
            <p class="book-author">히가시노 게이고</p>
          </div>
        </article>

        <!-- 03 -->
        <article class="book-card">
          <div class="book-cover">
            <img
              src="./img/sin 3.jpg"
              alt="당신의 독자가 될게요"
            />
          </div>

          <div class="book-info">
            <h3 class="book-title">당신의 독자가 될게요</h3>
            <p class="book-author">정세랑</p>
          </div>
        </article>

        <!-- 04 -->
        <article class="book-card">
          <div class="book-cover">
            <img
              src="./img/sin 4.jpg"
              alt="기대의 감각"
            />
          </div>

          <div class="book-info">
            <h3 class="book-title">기대의 감각</h3>
            <p class="book-author">김지은</p>
          </div>
        </article>

        <!-- 05 -->
        <article class="book-card">
          <div class="book-cover">
            <img
              src="./img/sin 5.jpg"
              alt="다시, 초격차"
            />
          </div>

          <div class="book-info">
            <h3 class="book-title">다시, 초격차</h3>
            <p class="book-author">권오현</p>
          </div>
        </article>

      </div>

    </section>

  </main>
    <script src="./js/main.js"></script>
    

</body>
</html>
