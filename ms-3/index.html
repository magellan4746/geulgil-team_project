<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>댓글리뷰섹션</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <section class="review-section">

  <!-- =========================
       함께 추가된 책
  ========================== -->
  <div class="review-related">

    <h2 class="review-related-title">
      ‘마이 셀렉트’에 함께 추가 된 책
    </h2>

    <div class="review-related-list">

      <article class="review-related-book">
        <img
          src="./img/book1.png"
          alt="오뒷세이아"
        >
        <p class="review-related-name">오뒷세이아</p>
      </article>

      <article class="review-related-book">
        <img
          src="./img/book2.png"
          alt="일상 질문 사전"
        >
        <p class="review-related-name">
          일상 질문 사전 : 100가지 질문으로 일상을 다르게 보고...
        </p>
      </article>

      <article class="review-related-book">
        <img
          src="./img/book3.png"
          alt="모순"
        >
        <p class="review-related-name">모순</p>
      </article>

      <article class="review-related-book">
        <img
          src="./img/book4.png"
          alt="위버멘쉬"
        >
        <p class="review-related-name">위버멘쉬</p>
      </article>

      <article class="review-related-book">
        <img
          src="./img/book5.png"
          alt="프로젝트 헤일메리"
        >
        <p class="review-related-name">프로젝트 헤일메리</p>
      </article>

    </div>

  </div>


  <div class="review-divider"></div>


  <div class="review-rating-area">

  <div class="review-my-rating">

    <h2 class="review-rating-title">
      이 책을 평가해주세요!
    </h2>

    <div class="review-stars" id="reviewStars" aria-label="별점 선택">
      <button type="button" class="review-star" data-value="1">★</button>
      <button type="button" class="review-star" data-value="2">★</button>
      <button type="button" class="review-star" data-value="3">★</button>
      <button type="button" class="review-star" data-value="4">★</button>
      <button type="button" class="review-star" data-value="5">★</button>
    </div>

  </div>


  <div class="review-buyer-rating">

    <span class="review-buyer-label">
      구매자 별점
    </span>

    <strong class="review-buyer-score">
      0.0
    </strong>

    <div class="review-buyer-stars">
      ★★★★★
    </div>

  </div>

</div>


<div class="review-write">

  <textarea
    id="reviewText"
    maxlength="500"
    placeholder="리뷰 작성 시 광고 및 욕설, 비속어나 타인을 비방하는 문구를 사용하시면 비공개될 수 있습니다."
  ></textarea>

</div>





  <!-- =========================
       리뷰 하단 옵션
  ========================== -->
  <div class="review-actions">

    <button
      type="button"
      class="review-warning-btn"
      id="reviewWarningBtn"
    >
      ⚠ 리뷰 작성 유의사항
    </button>


    <div class="review-actions-right">

      <label class="review-spoiler">
        <input
          type="checkbox"
          id="spoilerCheck"
        >
        <span>스포일러가 있습니다.</span>
      </label>

      <button
        type="button"
        class="review-submit-btn"
        id="reviewSubmitBtn"
      >
        리뷰 남기기
      </button>

    </div>

  </div>


  <!-- =========================
       리뷰 정렬
  ========================== -->
  <div class="review-filter">

    <div class="review-filter-left">

      <button
        type="button"
        class="review-filter-btn is-active"
        data-filter="buyer"
      >
        구매자
      </button>

      <button
        type="button"
        class="review-filter-btn"
        data-filter="all"
      >
        전체
      </button>

    </div>


    <div class="review-sort">

      <button
        type="button"
        class="review-sort-btn is-active"
        data-sort="latest"
      >
        최신순
      </button>

      <button
        type="button"
        class="review-sort-btn"
        data-sort="like"
      >
        공감순
      </button>

      <button
        type="button"
        class="review-sort-btn"
        data-sort="high"
      >
        별점 높은순
      </button>

      <button
        type="button"
        class="review-sort-btn"
        data-sort="low"
      >
        별점 낮은순
      </button>

    </div>

  </div>


  <!-- =========================
       리뷰 목록
  ========================== -->
  <div class="review-list" id="reviewList">

    <!-- 리뷰가 없을 때 -->
    <div class="review-empty" id="reviewEmpty">
      <p>아직 등록된 리뷰가 없습니다.</p>
      <strong>첫 번째 리뷰를 남겨주세요!</strong>
    </div>

  </div>



</section>
<script src="./js/index.js"></script>
</body>
</html>
